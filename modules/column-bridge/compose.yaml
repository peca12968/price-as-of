services:
  postgres:
    image: postgres:18
    ports:
      - "127.0.0.1:55432:5432"
    environment:
      POSTGRES_PASSWORD: local-drill
      POSTGRES_DB: rehearsal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rehearsal"]
      interval: 2s
      timeout: 3s
      retries: 20
