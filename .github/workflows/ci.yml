name: Verify bitemporal price audit
on: [push, pull_request]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest -v
      - run: python audit.py examples/revisions.csv examples/orders.csv --as-of 2026-04-23T00:00:00Z
      - uses: actions/checkout@v7
        with:
          repository: peca12968/rowgroup-scout
          ref: 9b61dca8ccd27c41082273229776684641245e75
          path: scout
      - run: python -m pip install -r scout/requirements.txt
      - run: python layout_drill.py scout
