name: Verify audience estimates
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'
          cache: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: go vet ./...
      - run: go test -v ./...
      - run: python demo.py
