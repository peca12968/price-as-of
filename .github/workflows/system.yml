name: Verify price-as-of system
'on':
- push
- pull_request
permissions:
  contents: read
jobs:
  audit:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
        - ubuntu-latest
        - windows-latest
        python:
        - '3.12'
        - '3.13'
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python }}
    - run: python -m pip install -r requirements.txt
    - run: python -m unittest -v
    - run: python audit.py examples/revisions.csv examples/orders.csv --as-of 2026-04-23T00:00:00Z
    - uses: actions/checkout@v7
      with:
        ref: 9b61dca8ccd27c41082273229776684641245e75
        path: scout
    - run: python -m pip install -r scout/requirements.txt
    - run: python layout_drill.py scout
  rowgroup-scout-test:
    strategy:
      matrix:
        os:
        - ubuntu-latest
        - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: modules/rowgroup-scout/requirements.txt
    - run: python -m pip install -r requirements.txt
    - run: python -m unittest -v
    - run: python layout_demo.py build-layout
    - run: python scout.py build-layout/sorted.parquet seq 4096 6144 --and seq 4500 6000 --project label
    - uses: actions/checkout@v7
      with:
        ref: a4324515476369c77c3b19587ea02cae93290257
        path: modules/rowgroup-scout/footprint
    - run: python -m pip install -r requirements-iceberg.txt
    - run: python iceberg_demo.py footprint/footprint.py
    defaults:
      run:
        working-directory: modules/rowgroup-scout
  iceberg-footprint-snapshots:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
        - ubuntu-latest
        - windows-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - run: 'python -m pip install --only-binary=:all: -r requirements.txt'
    - run: python -m unittest -v
    - run: python demo.py
    defaults:
      run:
        working-directory: modules/iceberg-footprint
