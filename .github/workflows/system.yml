name: Verify price-as-of system
'on':
- push
- pull_request
permissions:
  contents: read
jobs:
  audit:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
        - ubuntu-latest
        - windows-latest
        python:
        - '3.12'
        - '3.13'
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python }}
    - run: python -m pip install -r requirements.txt
    - run: python -m unittest -v
    - run: python audit.py examples/revisions.csv examples/orders.csv --as-of 2026-04-23T00:00:00Z
    - uses: actions/checkout@v7
      with:
        ref: 9b61dca8ccd27c41082273229776684641245e75
        path: scout
    - run: python -m pip install -r scout/requirements.txt
    - run: python layout_drill.py scout
  rowgroup-scout-test:
    strategy:
      matrix:
        os:
        - ubuntu-latest
        - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: modules/rowgroup-scout/requirements.txt
    - run: python -m pip install -r requirements.txt
    - run: python -m unittest -v
    - run: python layout_demo.py build-layout
    - run: python scout.py build-layout/sorted.parquet seq 4096 6144 --and seq 4500 6000 --project label
    - uses: actions/checkout@v7
      with:
        ref: a4324515476369c77c3b19587ea02cae93290257
        path: modules/rowgroup-scout/footprint
    - run: python -m pip install -r requirements-iceberg.txt
    - run: python iceberg_demo.py footprint/footprint.py
    defaults:
      run:
        working-directory: modules/rowgroup-scout
  iceberg-footprint-snapshots:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
        - ubuntu-latest
        - windows-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - run: 'python -m pip install --only-binary=:all: -r requirements.txt'
    - run: python -m unittest -v
    - run: python demo.py
    defaults:
      run:
        working-directory: modules/iceberg-footprint
  cohort-replay-replay:
    strategy:
      matrix:
        os:
        - ubuntu-latest
        - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - run: python -m unittest -v
    - run: python example_check.py
    defaults:
      run:
        working-directory: modules/cohort-replay
  reach-sketch-verify:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
        - ubuntu-latest
        - windows-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-go@v6
      with:
        go-version: 1.25.x
        cache: false
    - uses: actions/setup-python@v7
      with:
        python-version: '3.13'
    - run: go vet ./...
    - run: go test -v ./...
    - run: python demo.py
    defaults:
      run:
        working-directory: modules/reach-sketch
  column-bridge-migration:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        postgres:
        - '16'
        - '18'
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        ports:
        - 5432:5432
        env:
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: rehearsal
        options: --health-cmd pg_isready --health-interval 3s --health-timeout 3s --health-retries 15
    env:
      DATABASE_URL: postgresql://postgres:ci-only@127.0.0.1:5432/rehearsal
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: modules/column-bridge/package-lock.json
    - run: npm ci
    - run: npm test
    - run: npm run demo
    defaults:
      run:
        working-directory: modules/column-bridge
  page-ledger-sqlite:
    strategy:
      matrix:
        os:
        - ubuntu-latest
        - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: '3.12'
    - run: python -m unittest -v
    - run: python demo.py
    defaults:
      run:
        working-directory: modules/page-ledger
